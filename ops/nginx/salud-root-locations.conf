# Insertar estos bloques en el server HTTPS, antes de location /salud-dashboard.
# Instalar salud-root-security-headers.conf en /etc/nginx/snippets/.
location = /salud-dashboard {
    proxy_buffering off;
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/salud-root-security-headers.conf;
}

location = /salud-dashboard/ {
    include /etc/nginx/snippets/salud-root-security-headers.conf;
    return 308 /salud-dashboard;
}
