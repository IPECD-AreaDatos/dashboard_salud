# Candidato para appimi.corrientes.gob.ar. Requiere prueba con y sin sesión
# antes de incorporarlo a la configuración de producción.
# En el bloque http {}:
proxy_cache_path /var/cache/nginx/salud_anon levels=1:2
    keys_zone=salud_anon:10m max_size=20m inactive=1m use_temp_path=off;

# En el server HTTPS, antes de `location /salud-dashboard`:
location = /salud-dashboard {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Next.js marca esta página dinámica como private/no-store. Solo se fuerza
    # caché para la respuesta anónima, sin cookies, credenciales ni variantes RSC.
    proxy_ignore_headers Cache-Control;
    proxy_cache salud_anon;
    proxy_cache_valid 200 5s;
    proxy_cache_lock on;
    proxy_cache_bypass $http_cookie $args $http_authorization $http_rsc
        $http_next_router_state_tree $http_next_router_prefetch
        $http_next_router_segment_prefetch $http_upgrade;
    proxy_no_cache $http_cookie $args $http_authorization $http_rsc
        $http_next_router_state_tree $http_next_router_prefetch
        $http_next_router_segment_prefetch $http_upgrade $upstream_http_set_cookie;
    add_header X-Salud-Cache $upstream_cache_status always;
}
